<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção - KUROMI TV 🖤</title>
    <style>
        :root {
            --background-color: #1a1a1a; /* Preto escuro para fundo */
            --kuromi-dark: #3f0000;      /* Vermelho escuro de Kuromi (base) */
            --kuromi-accent: #ff3333;    /* Vermelho vibrante para destaque */
            --kuromi-text: #ffffff;      /* Texto principal branco */
            --kuromi-light-gray: #e0e0e0;/* Texto secundário */
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--kuromi-text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .maintenance-container {
            background-color: var(--kuromi-dark);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            max-width: 500px;
            width: 100%;
            border: 3px solid var(--kuromi-accent);
            animation: pulse-border 2s infinite alternate;
        }

        @keyframes pulse-border {
            from { border-color: var(--kuromi-accent); box-shadow: 0 0 20px rgba(255, 51, 51, 0.4); }
            to { border-color: #8B0000; box-shadow: 0 0 30px rgba(255, 51, 51, 0.8); }
        }

        .maintenance-icon {
            font-size: 60px;
            color: var(--kuromi-accent);
            margin-bottom: 20px;
            animation: shake 0.8s infinite;
            display: block;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        h1 {
            color: var(--kuromi-accent);
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 1.1em;
            line-height: 1.5;
            color: var(--kuromi-light-gray);
            margin-bottom: 30px;
        }

        .refresh-button {
            background-color: var(--kuromi-accent);
            color: var(--kuromi-text);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            text-decoration: none; /* Se fosse um link */
        }

        .refresh-button:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        
        <span class="maintenance-icon">🛠️</span>
        
        <h1>Serviço Em Manutenção</h1>
        
        <p>
        Ops! O Sistema Da ✰ KUROMI TV ✰ Está Temporariamente Indisponível. 
            Estamos Trabalhando Duro Para Restaurar Os Canais E A Estabilidade Da Plataforma.
        </p>
        
        <p style="font-size: 0.9em; margin-top: -10px; margin-bottom: 30px; color: var(--kuromi-light-gray);">
            Volte Em Alguns Minutos. Agradecemos Sua Paciência E Compreensão!
        </p>

        <button class="refresh-button" onclick="window.location.reload();">
            Tentar Novamente
        </button>

    </div>

</body>
</html>
